# Root world map registry.
#
# One entry per published skill in skills/. This file is the ONLY input that
# changes when the roster changes; .claude/data/generate-world-map.md turns it
# into a paste-ready image prompt. Adding a skill without adding its entry
# means the next map regeneration silently drops it.

canvas:
  # Root README displays at ~900px wide. See generate-world-map.md for the
  # type-floor arithmetic these numbers drive.
  primary: 1200x500       # 24:10 — the committed world-map.png
  overflow: 1440x960      # 3:2 — switch when skill count exceeds 10
  display_width: 900
  # Sized to the README slot at 1×. Deliberately NOT doubled for HiDPI: it
  # stays slightly soft on a retina display and that is the accepted trade.
  # Do not "fix" this by rendering at 2× — that halves the effective type
  # floor relative to the slot and the labels stop being the design.
  render_scale: 1x

title: Rick's agent-files   # the one title cartouche. No subtitle.

# The one blue thing. Style guide allows exactly one luminous cyan-blue
# element; on this map it is the trunk, not any single site.
blue:
  is: the work in progress — one river-and-rail trunk of electric cyan-blue
  enters: lower-left, a broad rough irregular braid of raw work
  leaves: right edge, a compact rolled blue scroll — the brightest blue in frame
  rule: >-
    Every skill site sits ON the trunk and visibly takes it in and puts it back
    changed. Continuous from entry to exit, no unexplained gaps. No site gets
    its own separate blue. No blue clothing, lamps, sky, trim, or signage.

# Two label classes, and the viewer must feel the difference before reading a
# word. Everything drawn on this map is one or the other.
label_system:
  category:
    is: a region banner — READING, PLANNING
    grammar: >-
      Giant elevated parchment standard or cloth banner on tall posts, hovering
      over the territory rather than attached to any building. Bold ALL-CAPS,
      spanning much of its region. Distinctly larger than any skill plaque.
  skill:
    is: a worksite plaque — /dag-reader, /refine-plan
    grammar: >-
      Rigid rectangular cream plaque, hard dark border, strong cast shadow,
      carved or brass mounting, physically attached to its worksite. Lowercase
      slash-command type. Smaller than a banner but still large — read it at
      subtitle scale, never as a secondary caption. Plaques are equal to each
      other in prominence, and each sits unmistakably inside its own region.

# Regions are drawn only when at least one skill claims them. Order is
# left-to-right along the trunk.
regions:
  - key: reading
    banner: READING
    ground: shaded pine ridge descending into a deep river gorge, left third
  - key: planning
    banner: PLANNING
    ground: high dry sunlit plateau, center-right
  - key: review
    banner: REVIEW
    ground: walled stone yard at a river junction
  - key: delivery
    banner: DELIVERY
    ground: open flats where the route exits toward the horizon

skills:
  - name: dag-reader
    region: reading
    plaque: /dag-reader
    # The frontier structure this skill becomes. One structure, one function.
    structure: >-
      A cliffside stone survey station of three stacked terraces linked by short
      ladders, the architecture itself reading as a narrowing funnel: broad
      intake opening, sorting and survey tables, narrowing stone channels.
      Two or three surveyors with transit instruments, no more.
    # What the blue trunk becomes passing through. Told architecturally — the
    # map carries no SOURCE/CRUX lettering to explain it.
    transform: >-
      The raw braid enters the top terrace very wide, is progressively
      constrained descending the terraces, and leaves the lowest terrace as one
      clean bright channel roughly a third of the original width.
    edges:
      - to: refine-plan
        route: down through the gorge and up onto the plateau — one clean line

  - name: refine-plan
    region: planning
    plaque: /refine-plan
    structure: >-
      An open plateau work yard: four separate canvas critic tents ringing one
      central brass assay scale on a stone plinth, with one short curved return
      rail looping around the center.
    transform: >-
      The incoming channel splits into four thin branches, one per tent, and
      visibly recombines at the scale. A blue rolled scroll rides the return
      loop — one bright current lap, one barely visible ghost trace of the
      previous lap, the current one shorter and denser. Only one ghost.
    # The loop ends when the scale stops moving.
    terminates: >-
      The brass scale has settled perfectly level and the return switch has
      fallen open toward the right-hand flats with no one touching it.
    edges:
      - to: dev-manager
        route: off the plateau onto the open right-hand flats — one clean line

  - name: screen-flow
    region: review
    plaque: /screen-flow
    structure: >-
      A long roofed timber gallery spanning a canyon on trestles: incoming
      viewport, a brass NAV press, a bellows SHOT camera, then equal FLOW
      panes under the roof. Map-scale, not the standalone hero at full
      complexity. A few workers, no crowd.
    transform: >-
      The incoming rolled scroll unrolls along the gallery as a sequence of
      window-sized panes; the same blue current is visible in every pane, and
      it leaves the far end of the yard re-rolled, the last pane the brightest.
    edges: []

  - name: dev-manager
    region: delivery
    plaque: /dev-manager
    structure: >-
      An open-flats dispatch yard: one elevated timber judging booth overlooking
      three or four parallel work tracks that reconverge at a single stone
      commit gate. A clerk in the booth, a few hands on the tracks, no crowd.
    transform: >-
      The incoming rolled scroll is unrolled at the booth, split onto the
      parallel tracks, and each piece is inspected at the gate before the
      accepted work is re-rolled. The compact exit scroll leaving the right
      edge is the same object that entered the yard, now tighter and sealed.
    # The loop ends when the last slice's done-when holds.
    terminates: >-
      The commit gate stands closed on a sealed scroll and every work track
      is empty, with no one touching the switch.
    edges:
      - to: handoff-beads
        route: across the open flats to the lattice house — one clean line

  - name: handoff-beads
    region: delivery
    plaque: /handoff-beads
    structure: >-
      A timber lattice house on the delivery flats: a wide intake apron of
      loose session cargo, a clipping bench, a standing wire lattice already
      hung with earlier beads, and a brass inspection gate at the far door.
      Two or three hands at the bench, no crowd.
    transform: >-
      The incoming braid is clipped into separate beads and hung onto empty
      hooks on the existing lattice. Nothing leaves as a scroll. The lattice
      itself, now complete, is what stands after the gate.
    terminates: >-
      The inspection gate has closed on a complete lattice with no loose
      cargo remaining on the apron.
    edges: []

  - name: expandable-reader
    region: reading
    plaque: /expandable-reader
    structure: >-
      A terraced reading pavilion on the gorge rim below the survey station: one wide
      map table on the top terrace, then a stair of shallow shelves stepping down,
      each shelf a row of small hinged doors. Two readers, one at the map, one
      opening a door on a lower shelf.
    transform: >-
      the braid arrives at the map table and is drawn as a single flat chart, then
      splits into thin threads that run down behind the shelf doors; a door opened
      lets one thread out to be read and closes again. The exit channel carries the
      chart and the threads together, folded, no wider than the chart.
    edges:
      - to: dag-reader
        route: short ladder up the rim to the survey station — one clean line

  - name: transcript-heatmap
    region: reading
    plaque: /transcript-heatmap
    structure: >-
      A river gauging weir spanning the gorge below the survey station: one long
      stone sill divided into many equal narrow bays, a graduated measuring post
      standing in each bay, and a raised walkway of reading desks along the top.
      Two gaugers walking the walkway, no crowd.
    transform: >-
      The braid arrives whole and is combed by the sill into many equal narrow
      streams, one per bay, each rising to a different marked height on its post
      so the row of heights reads as a profile across the weir. Downstream the
      streams rejoin into one channel no wider than the one that arrived.
    edges:
      - to: dag-reader
        route: up the gorge wall to the survey station — one clean line
